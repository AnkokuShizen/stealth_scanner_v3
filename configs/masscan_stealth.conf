# ═══════════════════════════════════════════════════════════════
# Masscan Stealth Configuration v3 — FortiGate/FortiWeb Friendly
# ═══════════════════════════════════════════════════════════════
#
# ⚠ مهم: orchestrator قبل از اسکن این فایل را با
#     masscan -c <this file> --echo
#   اعتبارسنجی می‌کند. کلید ناشناخته در masscan کل اجرا را fatal می‌کند.
#
# چرا ttl حذف شد؟
#   خیلی از buildهای masscan کلید ttl را نمی‌شناسند و fatal می‌شوند.
#   stock masscan بسته‌های SYN را با TTL 255 می‌فرستد که بدون پچ سورس
#   قابل تغییر نیست — این را در گزارش‌ها لحاظ کنید.
#
# چرا srcport حذف و source-port گذاشته شد؟
#   نام canonical پارامتر در masscan «source-port» است (نه srcport).
#   رنج اphemeral ویندوز/لینوکس برای شبیه‌سازی رفتار OS:
#
# ═══════════════════════════════════════════════════════════════

# نرخ ارسال پکت — conservative برای دیوارهای سازمانی
# 1000-3000: امن برای اکثر FortiGate ها (per-source DoS policy)
# 5000:      پیش‌فرض — پنجره زمانی کوتاه‌تر ولی شناسایی‌شدنی‌تر
# 10000+:    فقط با هماهنگی تیم امنیت
rate = 5000

# پورت منبع تصادفی در رنج epheremal — شکستن امضای single-source-port
source-port = 32768-65535

# تلاش مجدد برای شبکه‌های داخلی با packet loss
retries = 2

# مدت انتظار برای پاسخ SYN-ACK (ثانیه) — پیش‌فرض masscan ده است؛
# در LAN با RTT پایین 3-5 ثانیه کافی و خیلی سریع‌تر است
wait = 5

# ═══════════════════════════════════════════════════════════════
# نکته‌های عملیاتی (از CLI پاس داده می‌شوند — اینجا لازم نیست):
#   --randomize-hosts   : در orchestrator همیشه فعال است
#   --exclude ...       : رنج‌های حساس را حتماً exclude کنید (OT/ICS،
#                         تجهیزات پزشکی، پرینترهای قدیمی و...)
#   -e <iface>          : انتخاب اینترفیس با --interface
#
# یادآوری: SYN scan (پیش‌فرض masscan) هندشیک کامل نمی‌سازد و RST
# اضافه نمی‌فرستد — خودش stealth است؛ نرخِ پایین‌تر مهم‌ترین عامل است.
# ═══════════════════════════════════════════════════════════════
